  const clone=o=>JSON.parse(JSON.stringify(o));
  function distribute(total, weights){
    const totalInt=Math.round(total); const floats=weights.map(w=>totalInt*w);
    const initial=floats.map(Math.floor); let remaining=totalInt-initial.reduce((a,b)=>a+b,0);
    const indices=floats.map((n,i)=>({i,f:n-Math.floor(n)})).sort((a,b)=>b.f-a.f);

  }
  function validate(r){
    const errors=[]; const l=LIMITS[r.device||'studio'];

    if(!Number.isInteger(r.rpm)||r.rpm<60||r.rpm>120||r.rpm%10!==0)errors.push('سرعة الطاحونة يجب أن تكون بين 60 و120 وبخطوات 10.');
    if(!Array.isArray(r.pours)||!r.pours.length||r.pours.length>8){errors.push('عدد الصبات غير صالح.');return errors;}
    for(const [i,p] of r.pours.entries()){
      if(!Number.isInteger(p.ml)||p.ml<5||p.ml>240) errors.push(`الصبة ${i+1}: كمية الماء غير صالحة.`);
      if(!Number.isInteger(p.temp)||p.temp<l.tempMin||p.temp>l.tempMax)errors.push(`الصبة ${i+1}: الحرارة يجب أن تكون بين 40 و95°.`);

      if(!PATTERNS.includes(p.pattern))errors.push(`الصبة ${i+1}: شكل الصب غير صالح.`);
      if(!Number.isInteger(p.pause)||p.pause<0||p.pause>59)errors.push(`الصبة ${i+1}: الانتظار بين 0 و59 ثانية.`);
    }
    const sum=r.pours.reduce((a,p)=>a+p.ml,0);
    if(sum!==r.water)errors.push(`مجموع الصبات ${sum} مل، بينما كمية الماء المطلوبة ${r.water} مل.`);
    if(r.water<120||r.water>288)errors.push('ماء الاستخلاص خارج النطاق المحافظ 120–288 مل لهذه النسخة.');

  function makeRecipe(input={},variant='balanced'){
    if(!TYPES.includes(variant))throw new Error('Unknown variant');
    const water=clamp(Math.round(Number(input.water)||250),120,288);

    const preferenceGrind=passport?(Number(passport.clarity)>=4?-1:Number(passport.clarity)<=2?1:0):0;

    const darker=input.roast==='dark';

      device:'studio',dripper:input.dripper||'omni',mode:'hot',name:(input.name||'محصول جديد').trim().slice(0,100),roaster:(input.roaster||'').trim().slice(0,100),origin:input.origin||'',process:input.process||'unknown',roast:input.roast||'light',notes:input.notes||'',
      variant,water,dose,ratio:round(water/dose,2),grind,rpm:90,pours,createdAt:new Date().toISOString(),version:1,history:[],
      provenance:{type:'calculated',dataSources:['مدخلات المستخدم','قواعد استخلاص أولية'],confidence:'experimental',tasted:false,preferencesUsed:passport?{clarity:passport.clarity,sweet:passport.sweet}:null}};

  // Compatible cloud recipes use half-step brew ratios and whole-ml pours.
  // No values are transmitted by this function. Caller must show changes for consent.
  function alignXbloom(r){
    const current=clone(r);

      throw new Error('Invalid brew');

    const wantedDose=current.dose;
    const wantedRatio=current.water/current.dose;
    let best=null;
    for(let half=20;half<=44;half++){
      const ratio=half/2;
      for(let tenth=50;tenth<=180;tenth++){

        if(Math.abs(proposed-water)>1e-7||water<120||water>288)continue;
        const waterDiff=Math.abs(water-wantedWater);
        const ratioDiff=Math.abs(ratio-wantedRatio);
        const doseDiff=Math.abs(dose-wantedDose);
        const score=waterDiff*2+ratioDiff*9+doseDiff*1.2;
        if(!best||score<best.score-1e-9)best={water,dose,ratio,score};
      }
    }

    current.dose=best.dose;
    current.ratio=best.ratio;
    const changed=current.water!==r.water||Math.abs(current.dose-r.dose)>1e-7;
    if(changed){
      const sum=current.pours.reduce((total,p)=>total+Math.max(1,Number(p.ml)||1),0);

      current.history=Array.isArray(current.history)?current.history:[];
      current.history.push({at:new Date().toISOString(),type:'xbloom_dose_ratio_alignment',
        from:{dose:r.dose,water:r.water},to:{dose:best.dose,water:best.water,ratio:best.ratio}});
    }

  }
  function balancePours(r){
    const next=clone(r);const sum=next.pours.reduce((a,p)=>a+Math.max(1,Number(p.ml)||1),0);

    next.pours.forEach((p,i)=>p.ml=volumes[i]);return next;
  }

  }

  const api={LIMITS,PATTERNS,TASTE,distribute,makeRecipe,validate,alignXbloom,balancePours,updatePour,duration,agenda,adjust,difference,clone};
  root.MiyarEngine=api;if(typeof module!=='undefined'&&module.exports)module.exports=api;
})(typeof window!=='undefined'?window:globalThis);

</script>

function brand(){return `<a href="#" class="brand" data-action="home" aria-label="Miyar"><span class="brand-mark">${ic('coffee')}</span><span class="brand-name">${L('مِعيار','miyar')}<span class="mark-dot">.</span></span></a>`;}
function navLink(page,icon,title){return `<button type="button" class="navlink ${S.page===page?'active':''}" data-action="goto" data-page="${page}">${title}</button>`;}
function chrome(content){return `<header><div class="shell header-inner">${brand()}<nav class="mainnav" aria-label="main">${navLink('home','coffee',L('الرئيسية','Home'))}${navLink('wizard','sparkle',L('اصنع وصفتك','Create'))}${navLink('library','book',L('وصفاتي','My recipes'))}${navLink('lab','chart',L('مختبر المذاق','Taste lab'))}${navLink('about','info',L('عن مِعيار','About'))}</nav><div class="header-actions"><button class="lang" data-action="lang" title="Switch language">${S.lang==='ar'?'EN':'عربي'}</button><button class="btn btn-main btn-sm" data-action="start">${ic('plus','tiny')}${L('وصفة جديدة','New recipe')}</button></div></div></header><main id="main">${content}</main><footer><div class="shell footer-inner"><span>© 2026 ${L('مِعيار — مشروع تجريبي مستقل','Miyar — Independent beta')}</span><span>${L('غير تابع لشركة xBloom · الوصفات المحسوبة غير مختبرة تذوقيًا','Not affiliated with xBloom · Generated recipes are untested')}</span></div></footer><nav class="mobile-nav" aria-label="mobile"><button class="mobile-link ${S.page==='home'?'active':''}" data-action="goto" data-page="home">${ic('coffee')}${L('الرئيسية','Home')}</button><button class="mobile-link ${['wizard','result','compare'].includes(S.page)?'active':''}" data-action="start">${ic('sparkle')}${L('وصفة','Create')}</button><button class="mobile-link ${S.page==='library'?'active':''}" data-action="goto" data-page="library">${ic('book')}${L('وصفاتي','Saved')}</button><button class="mobile-link ${S.page==='lab'?'active':''}" data-action="goto" data-page="lab">${ic('chart')}${L('مذاقي','Taste')}</button></nav>`;}
function heroCup(){return `<div class="coffee-canvas"><span class="cup-saucer"></span><span class="cup-body"></span></div>`;}
function home(){return `<div class="shell"><section class="hero"><div><span class="pill">${ic('sparkle','tiny')}${L('جيل جديد من تحضير القهوة','A new way to brew')}</span><h1>${L('كل بنّ له حكاية.<br/><em>خلّ نكهته تحكي.</em>','Every bean has a story.<br/><em>Let the flavor speak.</em>')}</h1><p class="hero-copy">${L('من كيس البن إلى كوبك المفضل. وصفة محسوبة لذوقك، صبة بصبة، مع كل التفاصيل التي تحتاجها فقط.','From the bag to your favorite cup. A considered recipe for your taste, pour by pour, without the clutter.')}</p><div class="hero-actions"><button class="btn btn-main" data-action="start">${L('اصنع وصفتك الأولى','Make your first recipe')} ${ic('arrow','tiny')}</button><button class="btn btn-light" data-action="demo">${L('جرّب على قوجي','Try with Guji')} ${ic('play','tiny')}</button></div><div class="hero-points"><span>${ic('checkcircle','tiny')}${L('بدون تسجيل','No sign-up')}</span><span>${ic('checkcircle','tiny')}${L('مصمم لـ xBloom Studio','For xBloom Studio')}</span><span>${ic('checkcircle','tiny')}${L('حفظ محلي لخصوصيتك','Private local saves')}</span></div></div><div class="hero-visual"><span class="hero-tag">COFFEE, REIMAGINED.</span>${heroCup()}<div class="floating-note top"><div class="mini-bubble">${ic('sparkle')}</div><div><div class="note-strong">${L('على ذوقك تمامًا','Made for you')}</div><small>${L('وازن حموضتك وحلاوتك','Tune acidity & sweetness')}</small></div></div><div class="floating-note bottom"><div class="mini-bubble">${ic('drop')}</div><div><div class="note-strong">${L('كل صبة محسوبة','Every pour matters')}</div><small>16g · 256ml · 1:16</small></div></div></div></section><section class="feature-strip"><article class="feature"><span class="feature-icon">${ic('camera')}</span><div><b>${L('ابدأ من البن','Start with your beans')}</b><p>${L('أدخل اسم المحصول أو أضف صورته كمرجع، بدون حقول مزعجة.','Type your coffee or add a photo as reference.')}</p></div></article><article class="feature"><span class="feature-icon">${ic('sliders')}</span><div><b>${L('اختَر ذوقك','Choose your taste')}</b><p>${L('متوازن أم إيحاءات واضحة؟ والباقي على محرّك الوصفة.','Balanced or expressive? We handle the calculations.')}</p></div></article><article class="feature"><span class="feature-icon">${ic('chart')}</span><div><b>${L('تعلّم من كل كوب','Learn from each cup')}</b><p>${L('جرّب، قيّم، وعدّل متغيرًا واحدًا لتعرف ما الفرق.','Brew, rate and adjust one variable at a time.')}</p></div></article></section><section class="section-pad"><div class="mini-heading"><div class="eyebrow">${L('أكثر من أرقام','MORE THAN NUMBERS')}</div><h2>${L('مختبر صغير. فنجان أفضل.','A little lab. A better cup.')}</h2><p>${L('كل ميزة تساعدك على اتخاذ قرار أو اكتشاف شيء عن ذوقك، بدل ازدحام الشاشة بالمعلومات.','Every feature serves a decision, rather than filling the screen with knobs.')}</p></div><div class="three-grid"><div class="value-card"><span class="num">01 / A–B</span><h3>${L('وصفتان للمقارنة','Compare two recipes')}</h3><p>${L('ابدأ بالمتوازنة أو الجريئة، وافهم الفرق في الطحن والصبات قبل التحضير.','Start balanced or expressive and see exactly what changes.')}</p></div><div class="value-card"><span class="num">02 / PLAY</span><h3>${L('مرافق التحضير','Guided brew')}</h3><p>${L('مؤقّت يعرض المرحلة الحالية وما يجب فعله والتوقيت التالي.','A timer that tells you what to do now and next.')}</p></div><div class="value-card"><span class="num">03 / LEARN</span><h3>${L('تغيير واحد فقط','One change at a time')}</h3><p>${L('بعد تذوق الكوب، اقتراح تعديل محدد مع تفسيره، دون مبالغة في الوعود.','A single reasoned adjustment after tasting, with clear caveats.')}</p></div></div></section></div>`;}
function field(name,label,value,placeholder='',more=''){return `<div class="field ${more}"><label for="f-${name}">${label}</label><input class="input" id="f-${name}" name="${name}" data-input="${name}" value="${esc(value)}" placeholder="${esc(placeholder)}" maxlength="100"/></div>`;}
function selectField(name,label,opts,value){return `<div class="field"><label for="f-${name}">${label}</label><select class="select" id="f-${name}" data-input="${name}">${opts.map(([key,ar,en])=>`<option value="${key}" ${value===key?'selected':''}>${L(ar,en)}</option>`).join('')}</select></div>`;}
function stepper(){const titles=[L('المحصول','Beans'),L('الذوق','Taste'),L('وصفة','Recipe')];return `<div class="stepper" aria-label="${L('خطوات إنشاء الوصفة','Recipe progress')}">${titles.map((t,i)=>`${i?'<span class="step-line"></span>':''}<span class="step-indicator ${i===S.step?'active':i<S.step?'done':''}"><span>${i<S.step?ic('check','tiny'):i+1}</span>${t}</span>`).join('')}</div>`;}
function wizardBean(){return `<div class="workspace-card card">${stepper()}<div class="eyebrow">01 — ${L('البداية','FIRST THINGS FIRST')}</div><h2 class="workspace-title">${L('عرّفنا على بنّك.','Meet your coffee.')}</h2><p class="workspace-sub">${L('أدخل ما تعرفه فقط. كل معلومة ناقصة سنبقيها مجهولة، بدل التخمين.','Add only what you know. Missing details remain unknown, not guessed.')}</p><div class="upload" role="group" aria-label="${L('رفع صورة الكيس','Bag photo')}"><input id="photo" data-input="photo" type="file" accept="image/*" aria-label="${L('صورة كيس البن','Bean bag photo')}"/>${S.photo?`<img src="${S.photo}" alt="Bean bag preview"/>`:`<div class="upload-illustration">${ic('camera','big')}</div>`}<div><b>${S.photo?L('تم اختيار صورة الكيس','Bag photo selected'):L('عندك صورة للكيس؟','Have a bag photo?')}</b><small>${L('اضغط لرفع صورة أو التقط بالكاميرا','Tap to upload or take a photo')}</small></div></div><div class="upload-note">${L('الصورة تُعرض على جهازك فقط؛ القراءة التلقائية بالذكاء الاصطناعي غير مفعلة في هذه النسخة.','Image stays on your device; AI label recognition is not yet connected.')}</div><div class="subheading">${L('أو اكتب التفاصيل','Or enter the details')}</div><div class="field-grid">${field('name',L('اسم المحصول','Coffee name'),S.input.name,L('قوجي • Guji','Guji'))}${field('roaster',L('المحمصة (اختياري)','Roaster (optional)'),S.input.roaster,L('اسم المحمصة','Roaster name'))}${selectField('process',L('المعالجة','Process'),[['unknown','غير معروف','Unknown'],['washed','مغسولة','Washed'],['natural','مجففة / طبيعية','Natural'],['honey','عسلية','Honey'],['anaerobic','لاهوائية','Anaerobic']],S.input.process)}${selectField('roast',L('التحميص','Roast'),[['light','فاتح','Light'],['medium','متوسط','Medium'],['dark','غامق','Dark']],S.input.roast)}${field('origin',L('بلد البن (اختياري)','Origin (optional)'),S.input.origin,L('إثيوبيا','Ethiopia'))}${field('notes',L('الإيحاءات على الكيس (اختياري)','Tasting notes (optional)'),S.input.notes,L('توت، ياسمين، خوخ','Berries, jasmine, peach'))}</div><div class="wizard-actions"><button class="btn btn-light" data-action="home">${L('رجوع','Back')}</button><button class="btn btn-main" data-action="next">${L('التالي: اضبط ذوقك','Next: Your taste')} ${ic('arrow','tiny')}</button></div></div>`;}
function wizardTaste(){return `<div class="workspace-card card">${stepper()}<div class="eyebrow">02 — ${L('ضبط المذاق','YOUR PREFERENCES')}</div><h2 class="workspace-title">${L('كيف تحب فنجانك؟','How do you like it?')}</h2><p class="workspace-sub">${L('اختَر الإحساس الأقرب لذوقك. التفاصيل الاحترافية تظهر بعد إنشاء الوصفة.','Choose the cup you want. Advanced controls come later.')}</p><div class="subheading">${L('شخصية الوصفة','Recipe personality')}</div><div class="mode-cards"><button class="choice" data-action="variant" data-value="balanced" aria-pressed="${S.variant==='balanced'}"><span class="choice-icon">${ic('heart')}</span><b>${L('متوازنة','Balanced')}</b><small>${L('حلاوة ووضوح بدون حدّة','Smooth and even')}</small></button><button class="choice" data-action="variant" data-value="aroma" aria-pressed="${S.variant==='aroma'}"><span class="choice-icon">${ic('sparkle')}</span><b>${L('إيحاءات بارزة','Expressive')}</b><small>${L('نكهات أكثر حضورًا','Highlight flavor')}</small></button></div><div class="subheading">${L('جهازك','Your machine')}</div><div class="segmented"><button class="segment active" type="button">xBloom Studio</button><button class="segment" data-action="original" type="button">xBloom Original</button></div><small class="seg-help">${L('ندعم Studio حاليًا، ولا نخلط مقاييسه مع Original.','Studio is supported now. Original needs separate verified calibration.')}</small><div class="subheading">${L('حجم ماء الاستخلاص','Brew water')}</div><div class="row between wrap"><div class="segmented">${[200,240,250,280].map(n=>`<button class="segment ${S.input.water===n?'active':''}" data-action="water" data-value="${n}">${n} ${L('مل','ml')}</button>`).join('')}</div></div><small class="seg-help">${L('مجموع ماء الصبات قبل احتساب الماء المحتجز داخل البن.','Total poured water; not final beverage weight.')}</small><div class="subheading">${L('القمع','Dripper')}</div><div class="segmented"><button class="segment ${S.input.dripper==='omni'?'active':''}" data-action="dripper" data-value="omni">Omni</button><button class="segment ${S.input.dripper==='xpod'?'active':''}" data-action="dripper" data-value="xpod">xPod</button></div><details style="margin-top:24px"><summary style="cursor:pointer;font-weight:800;font-size:13px">${L('بوصلة ذوقي — تخصيص اختياري','Taste compass — optional preferences')}</summary><p class="small" style="margin-top:10px">${L('تُحفظ هذه الاختيارات لتساعد في تخصيص التجارب القادمة؛ المحرك الأولي لا يدّعي محاكاة الطعم بدقة.','Stored as your preferences; the initial engine does not predict taste with certainty.')}</p>${[['acid',L('الحموضة','Acidity')],['sweet',L('الحلاوة','Sweetness')],['body',L('القوام','Body')],['clarity',L('وضوح الإيحاءات','Flavor clarity')]].map(([k,title])=>`<div class="slider-row"><div class="slider-heading">${title}<span id="label-${k}">${S.passport[k]}/5</span></div><input type="range" class="range" min="1" max="5" step="1" value="${S.passport[k]}" data-passport="${k}" aria-label="${title}"/></div>`).join('')}</details><div class="wizard-actions"><button class="btn btn-light" data-action="prev">${L('رجوع','Back')}</button><button class="btn btn-main" data-action="generate">${ic('sparkle','tiny')}${L('أنشئ وصفتي','Generate my recipe')}</button></div></div>`;}
function wizard(){return `<div class="shell workspace"><div class="breadcrumbs">${L('الرئيسية / اصنع وصفتك','Home / Create recipe')}</div><div class="wizard"><section>${S.step===0?wizardBean():wizardTaste()}</section><aside class="assistant-side"><div class="side-preview"><div class="eyebrow" style="color:#a2c5a3">MIYAR STUDIO</div><h3>${L('البداية دائمًا من البنّ.','A better cup starts with the beans.')}</h3><p>${L('بدون تخمين. بدون تعقيد.','No guessing. No clutter.')}</p><div class="mini-cup">${heroCup()}</div><span class="glass-label">CRAFT YOUR CUP</span></div><div class="side-tips"><b>${ic('shield','tiny')} ${L('الوضوح جزء من الجودة','Transparency matters')}</b><p>${L('الوصفات هنا تجريبية محسوبة بالقواعد، وليست وصفات اختُبرت في مختبر أو تم تذوقها.','Recipes here are rule-based starting points, not tested or tasted profiles.')}</p></div></aside></div></div>`;}
function fieldSimple(index,field,label,value,options){return `<div class="field"><label for="p-${index}-${field}">${label}</label>${options?`<select class="select" id="p-${index}-${field}" data-pour-index="${index}" data-pour-field="${field}">${options.map(([v,a,b])=>`<option value="${v}" ${v===value?'selected':''}>${L(a,b)}</option>`).join('')}</select>`:`<input id="p-${index}-${field}" class="input" type="number" step="${field==='flow'?'0.1':'1'}" value="${value}" data-pour-index="${index}" data-pour-field="${field}"/>`}</div>`;}
const patAr={circular:'دائري',spiral:'حلزوني',center:'مركزي'};const patEn={circular:'Circular',spiral:'Spiral',center:'Centered'};
function pours(r){const agenda=E.agenda(r),maximum=Math.max(...r.pours.map(x=>x.ml));return `<div class="card timeline-card"><div class="section-row"><div><h3>${L('رحلة الماء','Pour timeline')}</h3><span class="muted small">${L('كل صبة بتفاصيلها — اضغط للتعديل','Tap any pour to edit its settings')}</span></div><span class="pill">${ic('clock','tiny')}${fmtTime(E.duration(r))} ${L('تقريبًا','est.')}</span></div><div class="brew-timeline" aria-label="${L('رسم كميات الصبات','Pour volume chart')}">${r.pours.map((p,i)=>`<div class="bar-group"><div class="brew-bar ${r.variant==='aroma'?'aroma':''}" style="height:${Math.round((p.ml/maximum)*61)}px"><span>${p.ml}</span></div><div class="brew-bar-index">0${i+1}</div></div>`).join('')}</div><div class="pour-list">${agenda.map((p,i)=>`<div class="pour-item"><button type="button" class="pour-summary" data-action="togglePour" data-index="${i}" aria-expanded="${S.openPour===i}"><span class="pour-no">${i+1}</span><span class="pour-summary-main"><b>${i===0?L('التزهير','Bloom'):L(`الصبة ${i+1}`,`Pour ${i+1}`)} · ${L(patAr[p.pattern],patEn[p.pattern])}</b><small>${fmtTime(p.start)} · ${p.temp}°C · ${p.flow.toFixed(1)} ${L('مل/ث','ml/s')} ${p.pause?`· ${L('انتظار','wait')} ${p.pause}${L('ث','s')}`:''}</small></span><span class="pour-value">${p.ml} <small>${L('مل','ml')}</small></span>${ic('chevron','tiny')}</button>${S.openPour===i?`<div class="pour-details"><div class="field-grid">${fieldSimple(i,'ml',L('الماء (مل)','Water (ml)'),p.ml)}${fieldSimple(i,'temp',L('الحرارة °C','Temperature °C'),p.temp)}${fieldSimple(i,'flow',L('التدفق (مل/ث)','Flow (ml/s)'),p.flow)}${fieldSimple(i,'pattern',L('نمط الصب','Pour pattern'),p.pattern,[['circular','دائري','Circular'],['spiral','حلزوني','Spiral'],['center','مركزي','Centered']])}${fieldSimple(i,'pause',L('انتظار (ث)','Pause (s)'),p.pause)}</div><div class="switches"><label><input type="checkbox" data-pour-index="${i}" data-pour-field="before" ${p.before?'checked':''}/> ${L('اهتزاز قبل الصبة','Vibrate before')}</label><label><input type="checkbox" data-pour-index="${i}" data-pour-field="after" ${p.after?'checked':''}/> ${L('اهتزاز بعد الصبة','Vibrate after')}</label></div></div>`:''}</div>`).join('')}</div>${E.validate(r).length?`<div class="inline-error" role="alert">${E.validate(r).map(esc).join('<br/>')}</div><button class="btn btn-light btn-sm" style="margin-top:10px" data-action="rebalance">${ic('refresh','tiny')}${L('أعد توزيع الماء','Rebalance water')}</button>`:`<div class="inline-success">${ic('checkcircle','tiny')} ${L('مجموع الصبات متطابق مع كمية الماء وإعدادات الجهاز ضمن حدود النسخة.','Pour totals match the water target and settings pass prototype limits.')}</div>`}</div>`;}
function tasteProfile(r){const isA=r.variant==='aroma';const profile=[[L('الحموضة','Acidity'),isA?72:49],[L('الحلاوة','Sweetness'),isA?62:78],[L('القوام','Body'),isA?54:70],[L('وضوح الإيحاءات','Clarity'),isA?86:64]];return `<div class="card sidebar-section"><div class="eyebrow">${L('توقعات تعليمية','ILLUSTRATIVE ONLY')}</div><h3>${L('بصمة الوصفة','Recipe fingerprint')}</h3><p class="small">${L('تصور بصري لاتجاه الوصفة، وليس تحليلًا حسيًا أو نتيجة تذوق.','Directional illustration, not measured or tasted flavor.')}</p><div class="profile-bars">${profile.map(([k,v])=>`<div class="profile-item"><span>${k}</span><div class="meter"><span style="width:${v}%"></span></div></div>`).join('')}</div></div>`;}
function result(){const r=S.recipe;if(!r)return emptyResult();const errorCount=E.validate(r).length;return `<div class="shell workspace"><div class="breadcrumbs">${L('مِعيار / وصفة جديدة / النتيجة','Miyar / New recipe / Result')}</div><div class="result-intro"><div><span class="pill">${ic('sparkle','tiny')}${L('وصفة محسوبة — تحتاج تذوقًا','Calculated recipe · Untasted')}</span><h1>${esc(r.name)}</h1><p>${r.roaster?`${esc(r.roaster)} · `:''}${r.variant==='aroma'?L('وصفة الإيحاءات البارزة','Expressive profile'):L('وصفة متوازنة','Balanced profile')} · xBloom Studio</p></div><div class="row wrap"><button class="btn btn-light btn-sm" data-action="compare">${ic('chart','tiny')}${L('قارن الوصفتين','Compare')}</button><button class="btn btn-main btn-sm" data-action="save">${ic('save','tiny')}${L('احفظ الوصفة','Save recipe')}</button></div></div><div class="result-shell"><div><div class="card top-stats"><div class="stat"><b>${r.dose}<span class="unit">${L('غ','g')}</span></b><small>${L('البن','Coffee')}</small></div><div class="stat"><b>${r.water}<span class="unit">${L('مل','ml')}</span></b><small>${L('الماء','Water')}</small></div><div class="stat"><b>${r.grind}</b><small>${L('طحن Studio','Studio grind')}</small></div><div class="stat"><b>${r.pours[0].temp}°</b><small>${L('حرارة البدء','Start temp')}</small></div></div>${pours(r)}<div class="card inset" style="margin-top:15px"><div class="section-row"><div><h3>${L('ابدأ التحضير','Start brewing')}</h3><p class="small" style="margin:4px 0">${L('مؤقّت إرشادي يساعدك على متابعة الصبات على الجوال.','A guided timer for following each pour.')}</p></div>${ic('clock','big')}</div><button class="btn btn-main btn-block" data-action="brew">${ic('play','tiny')}${L('شغّل المرافق','Start guide')}</button></div><div class="card inset" style="margin-top:15px"><div class="section-row"><h3>${L('جرّبت الوصفة؟','Tasted this recipe?')}</h3>${ic('star')}</div><p class="small">${L('قيّم النتيجة، ونقترح تغييرًا واحدًا قابلًا للمقارنة.','Rate your cup and get one clear change to test.')}</p><button class="btn btn-light btn-block" data-action="taste">${L('سجّل نتيجة الكوب','Log my cup')} ${ic('arrow','tiny')}</button></div></div><aside class="detail-sidebar">${tasteProfile(r)}<div class="card sidebar-section"><h3>${L('لماذا هذه الأرقام؟','Why these settings?')}</h3><div class="reason">${ic('info','tiny')} ${L('نسبة 1:16 نقطة بداية حسابية، وليست نتيجة اختبار لهذا البن.','1:16 is a rule-based starting point, not a tested coffee result.')}</div><div class="reason">${ic('info','tiny')} ${r.process==='natural'?L('المعالجة الطبيعية أثّرت في الطحن المبدئي المقترح.','Natural processing influenced the initial grind.'):L('استُخدمت درجة الطحن الافتراضية ثم عُدّلت حسب التحميص والنمط.','Base grind adjusted for roast and chosen style.')}</div><div class="reason">${ic('info','tiny')} ${L('الصبات موزعة بأوزان ثابتة، ومجموعها يطابق الماء المطلوب.','Pours follow known weights and exactly sum to the target.')}</div>${r.provenance.preferencesUsed?`<div class="reason">${ic('info','tiny')} ${L('استُخدمت بوصلة وضوح الإيحاءات والحلاوة في تعديل محدود للطحن/الحرارة؛ هذه فرضية قابلة للتجربة.','Your clarity and sweetness preferences informed small grind/temperature changes; these are testable hypotheses.')}</div>`:''}${r.history?.length?`<div class="reason">${L('تعديل من تجربة سابقة:','Based on prior feedback:')} ${esc(r.history.at(-1).reason)}</div>`:''}<p class="xsmall" style="margin:12px 0 0">${L('المصادر: مدخلاتك + قواعد أولية؛ لا توجد قاعدة وصفات منشورة متصلة بعد.','Sources: your inputs + initial heuristics; no live reference-recipe database yet.')}</p></div><div class="card sidebar-section export-disabled"><h3>${L('شارك وصفتك','Export & share')}</h3><button class="btn btn-light btn-block" data-action="copy">${ic('copy','tiny')}${L('انسخ خطوات التحضير','Copy brew steps')}</button><button class="btn btn-light btn-block" data-action="download">${ic('download','tiny')}${L('نزّل الوصفة JSON','Download recipe JSON')}</button><button class="btn btn-light btn-block" data-action="share">${ic('share','tiny')}${L('انسخ رابط المشاركة','Copy share link')}</button>${S.xbloomExportedSnapshot===JSON.stringify(r)&&S.xbloomShareUrl?`<a class="btn btn-main btn-block" href="${esc(S.xbloomShareUrl)}" target="_blank" rel="noopener">${S.xbloomVerified===false?L('تحقق من الرابط في xBloom ↗','Check link in xBloom ↗'):L('افتح الوصفة في xBloom ↗','Open recipe in xBloom ↗')}</a>`:`<button class="btn btn-main btn-block" data-action="xbloomExport">${L('تصدير إلى xBloom (تجريبي)','Export to xBloom (beta)')}</button>`}<button class="btn btn-light btn-block" data-action="xbloomCheck">${L('فحص حساب xBloom دون تصدير','Check xBloom account without exporting')}</button><p>${L('نسخة اختبار للمسؤول: الوصفة تُرسل بنفس مقاديرها وصباتها، ويدعم التصدير قمع Omni فقط. لا تعِد المحاولة قبل فحص الوصفات المحفوظة.','Owner-only beta. Recipe settings are preserved; Omni export only. Check saved recipes before retrying a failed request.')}</p>${S.xbloomLastStatus?`<p role="alert" style="padding:12px;border:1px solid #d3d6cf;border-radius:10px;white-space:pre-wrap;word-break:break-word">${esc(S.xbloomLastStatus)}</p>`:''}${Array.isArray(S.xbloomCheckLinks)&&S.xbloomCheckLinks.length?`<div style="margin-top:10px">${S.xbloomCheckLinks.map(x=>x.shareUrl?`<a class="btn btn-light btn-block" style="margin-bottom:8px" href="${esc(x.shareUrl)}" target="_blank" rel="noopener">${L('افتح: ','Open: ')}${esc(x.name)} ↗</a>`:`<p class="small">${esc(x.name)} — ${L('محفوظة دون رابط مشاركة','Saved without share link')}</p>`).join('')}</div>`:''}</div><button class="btn btn-light btn-block" data-action="start">${ic('plus','tiny')}${L('وصفة لمحصول آخر','Try another bean')}</button></aside></div></div>`;}
function emptyResult(){return `<div class="shell workspace"><div class="empty">${L('لا توجد وصفة مفتوحة.','No recipe is open.')}<div style="margin-top:20px"><button class="btn btn-main" data-action="start">${L('ابدأ','Get started')}</button></div></div></div>`;}
function compare(){const a=S.recipe,b=S.alternative;if(!a||!b)return emptyResult();return `<div class="shell workspace"><div class="breadcrumbs">${L('النتيجة / مقارنة الوصفات','Result / Compare recipes')}</div><span class="pill">A / B</span><h2 style="margin:16px 0 8px">${L('وصفة واحدة. طريقان للنكهة.','One bean. Two approaches.')}</h2><p>${L('الاختلافات محسوبة وليست نتيجة تجربة تذوق مؤكدة. اختر نقطة بداية ثم سجل النتيجة.','Differences are calculated, not tasting-tested. Pick a starting point and log the result.')}</p><div class="comparison" style="margin:28px 0"><div class="card compare-card"><span class="eyebrow">A · BALANCED</span><h3>${L('المتوازنة','Balanced')}</h3><p>${L('صبات أقل، وتوزيع ناعم للبداية.','Fewer pours, simpler schedule.')}</p><button class="btn ${a.variant==='balanced'?'btn-main':'btn-light'} btn-block" data-action="selectVariant" data-value="balanced">${L('اختر المتوازنة','Choose balanced')}</button></div><div class="card compare-card"><span class="eyebrow">B · EXPRESSIVE</span><h3>${L('الإيحاءات البارزة','Expressive')}</h3><p>${L('صبة إضافية وجدول مختلف للاستكشاف.','One extra pour and a different experiment.')}</p><button class="btn ${a.variant==='aroma'?'btn-main':'btn-light'} btn-block" data-action="selectVariant" data-value="aroma">${L('اختر الإيحاءات','Choose expressive')}</button></div></div><div class="card inset"><div class="compare-row compare-head"><span>${L('المتغير','Variable')}</span><b>${L('متوازنة','Balanced')}</b><b>${L('إيحاءات','Expressive')}</b></div>${E.difference(a.variant==='balanced'?a:b,a.variant==='aroma'?a:b).map((x,i)=>`<div class="compare-row"><span>${L(x.label,['Grind','Coffee','Water','Pours','Estimated duration'][i])}</span><b>${x.a} ${x.unit}</b><b>${x.b} ${x.unit}</b></div>`).join('')}</div><div style="margin-top:20px"><button class="btn btn-light" data-action="goto" data-page="result">${L('ارجع للوصفة','Back to recipe')}</button></div></div>`;}
function library(){return `<div class="shell workspace"><div class="row between wrap"><div><div class="eyebrow">MY BREW LIBRARY</div><h2 style="margin:5px 0">${L('وصفات تستاهل ترجع لها.','Worth brewing again.')}</h2><p>${L('تُحفظ على هذا الجهاز فقط؛ لا توجد مزامنة سحابية بعد.','Saved on this device only; no cloud sync yet.')}</p></div><button class="btn btn-main btn-sm" data-action="start">${ic('plus','tiny')}${L('وصفة جديدة','New recipe')}</button></div>${S.library.length?`<div class="library-grid" style="margin-top:30px">${S.library.map((r,i)=>`<article class="card recipe-tile"><div><span class="pill">${r.variant==='aroma'?L('إيحاءات','Expressive'):L('متوازنة','Balanced')}</span><h3 style="margin:14px 0 5px">${esc(r.name)}</h3><p>${r.dose} ${L('غ','g')} · ${r.water} ${L('مل','ml')} · xBloom Studio</p></div><div class="tile-bottom"><button class="btn btn-main btn-sm" data-action="openSaved" data-index="${i}">${L('افتح الوصفة','Open recipe')} ${ic('arrow','tiny')}</button><button class="btn-icon" data-action="deleteSaved" data-index="${i}" aria-label="${L('احذف الوصفة','Delete recipe')}">${ic('trash','tiny')}</button></div></article>`).join('')}</div>`:`<div class="empty" style="margin-top:30px"><div class="empty-icon">${ic('book','huge')}</div><h3>${L('لسّه ما حفظت أي وصفة','No saved recipes yet')}</h3><p>${L('اصنع وصفة قوجي الأولى واحفظها هنا، ثم ارجع لها في أي وقت.','Create your first recipe, then revisit it anytime.')}</p><button class="btn btn-main" data-action="demo">${L('ابدأ بوصفة قوجي','Start with Guji')}</button></div>`}</div>`;}
function lab(){const num=S.tastings.length;const avg=num?Math.round(S.tastings.reduce((sum,t)=>sum+t.stars,0)/num*10)/10:0;return `<div class="shell workspace"><div class="eyebrow">YOUR TASTE PASSPORT</div><h2 style="margin:10px 0">${L('ذوقك هو المرجع الأهم.','Your taste is the reference.')}</h2><p>${L('ملاحظاتك تساعدك على مقارنة المحاولات. لن نسمي الاستنتاجات ذكاءً متعلمًا قبل توفر سجل كافٍ من التجارب.','Your own tasting log informs comparisons; we do not claim a trained model without enough observations.')}</p><div class="three-grid" style="margin:26px 0"><div class="value-card"><span class="num">${L('عدد المحاولات','Tasting logs')}</span><h2>${num}</h2></div><div class="value-card"><span class="num">${L('متوسط التقييم','Average rating')}</span><h2>${avg||'—'} ${num?'★':''}</h2></div><div class="value-card"><span class="num">${L('الوصفات المحفوظة','Saved recipes')}</span><h2>${S.library.length}</h2></div></div>${num?`<h3>${L('سجل التذوق','Tasting history')}</h3><div class="stack">${S.tastings.slice().reverse().map(x=>`<div class="card inset"><div class="row between wrap"><b>${esc(x.bean)}</b><span style="color:#ae8b41;font-weight:800">${'★'.repeat(x.stars)}${'☆'.repeat(5-x.stars)}</span></div><p class="small" style="margin:8px 0">${x.issue?L(E.TASTE[x.issue]?.ar||'','Tasting note'):'—'} ${esc(x.notes||'')}</p><small class="muted">${new Date(x.at).toLocaleDateString(S.lang==='ar'?'ar-SA':'en-US')}</small></div>`).join('')}</div>`:`<div class="empty"><div class="empty-icon">${ic('heart','huge')}</div><h3>${L('أول كوب هو أول معلومة.','Your first cup is your first insight.')}</h3><p>${L('حضّر وصفة وسجّل تقييمك لتبدأ سجل مذاقك.','Brew, taste and rate your first recipe.')}</p><button class="btn btn-main" data-action="demo">${L('حضّر قوجي','Brew Guji')}</button></div>`}</div>`;}
function tasting(){const r=S.recipe;if(!r)return emptyResult();return `<div class="shell workspace"><div class="breadcrumbs">${L('النتيجة / تقييم الكوب','Result / Cup rating')}</div><div style="max-width:780px;margin:auto"><div class="card workspace-card"><span class="pill">${ic('heart','tiny')}${L('سجل كوبك','TASTE JOURNAL')}</span><h2 style="margin:18px 0 7px">${L('كيف كان طعم','How did')} ${esc(r.name)}؟</h2><p>${L('الانطباع الحقيقي أهم من أي رقم اقترحه المحرك.','Your actual tasting matters more than any generated number.')}</p><div class="subheading">${L('تقييمك','Your rating')}</div><div class="rate-stars">${[1,2,3,4,5].map(n=>`<button class="star ${n<=S.stars?'active':''}" data-action="rate" data-value="${n}" aria-label="${n} ${L('نجوم','stars')}">★</button>`).join('')}</div><div class="subheading">${L('وش تبي يتغير؟','What should change?')}</div><div class="taste-issues">${Object.entries(E.TASTE).map(([id,v])=>`<button class="issue ${S.issue===id?'active':''}" data-action="issue" data-value="${id}">${L(v.ar,({sour:'Too sour',bitter:'Too bitter',watery:'Watery',muted:'Muted notes',balanced:'Unbalanced'}[id]))}</button>`).join('')}</div><div class="field" style="margin-top:20px"><label for="taste-note">${L('ملاحظاتك (اختياري)','Notes (optional)')}</label><textarea class="textarea" id="taste-note" data-input="tasteNotes" maxlength="500" placeholder="${L('شمّيت ياسمين، لكن الحموضة مرتفعة…','Floral aroma, but too acidic…')}">${esc(S.tasteNotes)}</textarea></div><div class="wizard-actions"><button class="btn btn-light" data-action="goto" data-page="result">${L('رجوع','Back')}</button><button class="btn btn-main" data-action="saveTaste">${ic('save','tiny')}${L('احفظ التقييم','Save tasting')}</button></div>${S.ratingSaved?`<div class="inline-success">${ic('checkcircle','tiny')}${L('تم توثيق تقييمك على هذا الجهاز.','Your rating is saved on this device.')}</div>`:''}</div>${S.issue?`<div class="suggest-box"><div class="eyebrow">ONE-CHANGE EXPERIMENT</div><h3>${L('تجربتك التالية: تغيير واحد','Your next brew: One change')}</h3><p>${L(E.TASTE[S.issue].why,({sour:'Try slightly finer grind to increase extraction. A hypothesis, not a guarantee.',bitter:'Try slightly coarser grind to reduce extraction.',watery:'Increase dose by 0.5g while keeping water fixed.',muted:'Test one finer grind step.',balanced:'Test one coarser grind step.'}[S.issue]))}</p><div class="row wrap"><button class="btn btn-main btn-sm" data-action="applyTaste">${L('أنشئ النسخة المحسّنة','Create adjusted version')}</button><span class="small muted">${L('لن نستبدل الوصفة الأصلية.','Original recipe remains unchanged.')}</span></div></div>`:''}</div></div>`;}
function brewing(){const b=S.brew,r=S.recipe;if(!b||!r)return emptyResult();const all=E.agenda(r);const elapsed=b.elapsed||0;const current=all.find(x=>elapsed<x.finish)||all[all.length-1];const finished=elapsed>=E.duration(r);const waiting=!finished&&elapsed>=current.start+current.pourTime;const pct=Math.min(100,Math.round(elapsed/E.duration(r)*100));return `<div class="shell workspace"><div class="breadcrumbs">${L('وصفتي / المرافق','My recipe / Brew companion')}</div><div class="brew-mode"><span class="pill" style="background:#2d6249;border-color:#3d7658;color:#def0c7">${ic('clock','tiny')} BREW COMPANION</span><h2 style="margin-top:21px">${finished?L('صحة وعافية!','Enjoy your coffee!'):waiting?L('وقت الانتظار','Pause & let it bloom'):`${L('الصبة','Pour')} ${current.index+1} / ${all.length}`} </h2><p>${finished?L('انتهت مراحل الوصفة المحسوبة. قيّم الكوب بعد التذوق.','Guided stages complete. Rate your cup after tasting.'):waiting?L(`توقف عن الصب وانتظر ${Math.ceil(current.finish-elapsed)} ثانية ثم انتقل للصبة التالية.`,`Stop pouring and wait ${Math.ceil(current.finish-elapsed)} seconds for the next stage.`):L(`صب ${current.ml} مل بنمط ${patAr[current.pattern]} عند ${current.temp}°`, `Pour ${current.ml}ml ${patEn[current.pattern]} at ${current.temp}°C`)}</p><div class="brew-big-time" id="timer-text">${fmtTime(elapsed)}</div><p>${L('من','of')} ${fmtTime(E.duration(r))} · ${L('الماء المستهدف عند نهاية هذه الصبة','Cumulative target after this pour')}: ${current.cumulative} ${L('مل','ml')}</p><div class="brew-progress"><span id="timer-progress" style="width:${pct}%"></span></div><div class="brew-control"><button class="btn btn-accent" data-action="timerToggle">${b.running?ic('pause','tiny'):ic('play','tiny')}${b.running?L('إيقاف مؤقت','Pause'):L('ابدأ / استأنف','Start / Resume')}</button><button class="btn btn-light" data-action="timerReset">${ic('reset','tiny')}${L('من البداية','Reset')}</button><button class="btn btn-light" data-action="timerEnd">${L('انهِ التحضير','Finish')}</button></div></div><div class="card inset" style="margin-top:16px"><h3>${L('المراحل التالية','Schedule')}</h3>${all.map((x,i)=>`<div class="row between" style="padding:10px;border-bottom:1px solid var(--line);opacity:${i<current.index?.48:1}"><div><b>${L('صبة','Pour')} ${i+1} ${i===current.index?'←':''}</b><div class="muted small">${L(patAr[x.pattern],patEn[x.pattern])} · ${x.ml}${L('مل','ml')} · ${x.pause}${L('ث انتظار','s pause')}</div></div><b>${fmtTime(x.start)}</b></div>`).join('')}</div><div class="notice" style="margin-top:15px">${ic('info','tiny')}${L('الوقت إرشادي محسوب من كمية الماء والتدفق وفترات الانتظار. لا يوجد اتصال حي بالمكينة.','Estimated from volume, flow and pauses. No live machine connection.')}</div></div>`;}
function about(){return `<div class="shell workspace"><div class="eyebrow">BEHIND THE CUP</div><h2 style="margin:9px 0 10px">${L('الشفافية قبل الوعود.','Clear science. Clear limits.')}</h2><p style="max-width:700px">${L('مِعيار مشروع مستقل لتبسيط تحضير القهوة. في النسخة الحالية، الوصفات محسوبة بقواعد ثابتة قابلة للاختبار، وليست من قاعدة محامص موثقة أو من نموذج تذوق.','Miyar is an independent recipe builder. The current engine uses deterministic, testable rules—not a validated roaster database or sensory AI.')}</p><div class="about-grid" style="margin-top:22px"><div class="card inset"><h3>${L('ما الذي يعمل؟','What works')}</h3><p>${L('إنشاء وصفتين، ضبط الصبات، التحقق من الحدود، المؤقت الإرشادي، المقارنة، الحفظ المحلي، سجل التذوق، واقتراح تغيير واحد.','Two variants, editable pours, constraints, guided timer, comparison, local saves, ratings, single-variable changes.')}</p></div><div class="card inset"><h3>${L('ما الذي لا يعمل بعد؟','Not connected yet')}</h3><p>${L('قراءة الكيس آليًا، مزامنة حسابات المستخدمين، قاعدة وصفات منشورة، والتصدير الرسمي إلى xBloom.','Automated bag scanning, cloud account sync, sourced recipe retrieval and authorized xBloom export.')}</p></div><div class="card inset"><h3>${L('عن جهاز Studio','About Studio')}</h3><p>${L('يدعم الطاحونة ذات 80 إعدادًا وأنماط الصب المركزي والدائري والحلزوني. حدود التحقق داخل المنتج محافظة وتحتاج اختبارًا إضافيًا داخل التطبيق الفعلي.','Studio offers 80 grind settings, centered, circular and spiral pours. Prototype limits are conservative and still require real-app confirmation.')}</p><a class="source-link small" href="https://xbloom.com/products/xbloom-studio" target="_blank" rel="noopener">${L('المواصفات الرسمية','Official specifications')} ↗</a></div><div class="card inset"><h3>${L('المصادر والتراخيص','Sources & licensing')}</h3><p>${L('لم ننسخ قاعدة بيانات رشف أو محتوى وصفات منافسين. أي جمع لاحق لوصفات منشورة يتطلب مصدرًا وترخيصًا واضحين.','No competitor database or recipes were copied. Future recipe ingestion requires clear permissions and attribution.')}</p><a class="source-link small" href="https://rashf.net/about" target="_blank" rel="noopener">${L('شرح رشف العلني','Rashf public methodology')} ↗</a></div></div></div>`;}
function render(){document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';document.title=L('مِعيار | قهوتك على ذوقك','Miyar | Brew your way');const content=({home,wizard,result,compare,library,lab,tasting,brewing,about}[S.page]||home)();$('#app').innerHTML=chrome(content);}
function inputValue(key,value){if(key==='tasteNotes')S.tasteNotes=String(value).slice(0,500);else if(key==='photo'){}else if(key==='water')S.input.water=Number(value);else S.input[key]=String(value);}
function brewText(r){return `${L('وصفة','Recipe')}: ${r.name}\n${L('البن','Coffee')}: ${r.dose}g | ${L('الماء','Water')}: ${r.water}ml | ${L('طحن','Grind')}: ${r.grind} | RPM: ${r.rpm}\n${r.pours.map((p,i)=>`${i+1}. ${p.ml}ml · ${p.temp}°C · ${p.flow.toFixed(1)}ml/s · ${L(patAr[p.pattern],patEn[p.pattern])} · ${L('انتظار','Pause')} ${p.pause}s ${p.before?'· VIB BEFORE ':''}${p.after?'· VIB AFTER':''}`).join('\n')}\n${L('تنبيه: وصفة تجريبية محسوبة وليست وصفة xBloom مستوردة.','Prototype recipe, not an imported xBloom card.')}`;}
function copyText(text){if(navigator.clipboard?.writeText)return navigator.clipboard.writeText(text);const el=document.createElement('textarea');el.value=text;document.body.appendChild(el);el.select();document.execCommand('copy');el.remove();return Promise.resolve();}
function initShared(){try{const h=location.hash;if(!h.startsWith('#r='))return;const encoded=decodeURIComponent(h.slice(3));const binary=atob(encoded);const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));const r=JSON.parse(new TextDecoder().decode(bytes));if(r.schema==='miyar.recipe.v2'&&E.validate(r).length===0){S.recipe=r;S.alternative=E.makeRecipe(r,r.variant==='balanced'?'aroma':'balanced');S.page='result';}else toast(L('رابط الوصفة غير صالح','Invalid shared recipe'));}catch{toast(L('تعذر قراءة رابط الوصفة','Could not read recipe link'));}}
async function saveRecipe(){const r=S.recipe;if(!r||E.validate(r).length){toast(L('صحّح إعدادات الوصفة قبل الحفظ','Fix recipe errors before saving'));return;}const existing=S.library.findIndex(x=>x.id===r.id);if(existing>=0)S.library[existing]=E.clone(r);else S.library.unshift(E.clone(r));S.library=S.library.slice(0,60);if(store.set('miyar.library',S.library))toast(L('حُفظت الوصفة على هذا الجهاز','Saved on this device'));else toast(L('المتصفح منع الحفظ المحلي','Local storage is unavailable'));if(S.backendConnected){try{const response=await fetch('/api/recipes',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({recipe:r})});if(response.ok)toast(L('تم حفظ نسخة في جلسة المتصفح على الخادم','Saved in your private server guest session'));}catch{toast(L('الحفظ السحابي غير متاح، النسخة المحلية محفوظة','Server save unavailable; local copy retained'));}}}
function startSample(){S.input={name:'قوجي Guji',roaster:'',origin:'إثيوبيا',process:'natural',roast:'light',notes:'توت، زهور، فواكه',water:250,dripper:'omni'};S.variant='aroma';S.step=0;S.photo=null;setPage('wizard');}
function startNew(){S.input={name:'',roaster:'',origin:'',process:'unknown',roast:'light',notes:'',water:250,dripper:'omni'};S.variant='balanced';S.step=0;S.photo=null;S.openPour=-1;setPage('wizard');}
async function make(){const base={...S.input,passport:{...S.passport}};if(!base.name.trim()){toast(L('اكتب اسم المحصول أولًا','Enter your coffee name first'));S.step=0;render();return;}S.recipe=null;if(S.backendConnected){try{const response=await fetch('/api/recipes/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({coffee:base,variant:S.variant})});if(response.ok){S.recipe=(await response.json()).recipe;}}catch{}}S.recipe=S.recipe||E.makeRecipe(base,S.variant);const oldTasting=[...S.tastings].reverse().find(t=>t.bean.trim()===base.name.trim()&&t.issue&&t.stars<=3);if(oldTasting){const adjusted=E.adjust(S.recipe,oldTasting.issue);if(E.validate(adjusted.recipe).length===0)S.recipe=adjusted.recipe;}S.alternative=E.makeRecipe(base,S.variant==='balanced'?'aroma':'balanced');S.openPour=-1;S.stars=0;S.issue=null;S.ratingSaved=false;setPage('result');}
function onAction(node){const a=node.dataset.action;const index=Number(node.dataset.index);const value=node.dataset.value;
 switch(a){
 case 'goto':setPage(node.dataset.page);break;case 'home':setPage('home');break;case 'start':startNew();break;case 'demo':startSample();break;case 'lang':S.lang=S.lang==='ar'?'en':'ar';store.set('miyar.lang',S.lang);render();break;
 case 'next':{if(!S.input.name.trim()){toast(L('أدخل اسم البن للمتابعة','Enter a bean name'));$('#f-name')?.focus();return;}S.step=1;render();break;}
 case 'prev':S.step=0;render();break;case 'variant':S.variant=value;render();break;case 'water':S.input.water=Number(value);render();break;case 'dripper':S.input.dripper=value;render();break;
 case 'original':toast(L('لا نعرض إعدادات Original قبل التحقق من نطاق الطحن الخاص به.','Original grind calibration requires separate verification.'));break;
 case 'generate':make();break;case 'togglePour':S.openPour=S.openPour===index?-1:index;render();break;
 case 'rebalance':S.recipe=E.balancePours(S.recipe);render();toast(L('أُعيد توزيع الماء بالتناسب','Water rebalanced'));break;
 case 'save':saveRecipe();break;case 'compare':setPage('compare');break;
 case 'selectVariant':if(S.recipe.variant!==value){const old=S.recipe;S.recipe=S.alternative;S.alternative=old;}S.openPour=-1;setPage('result');break;
 case 'openSaved':S.recipe=E.clone(S.library[index]);S.alternative=E.makeRecipe(S.recipe,S.recipe.variant==='balanced'?'aroma':'balanced');S.openPour=-1;setPage('result');break;
 case 'deleteSaved':if(!confirm(L('حذف هذه الوصفة المحفوظة؟','Delete saved recipe?')))break;S.library.splice(index,1);store.set('miyar.library',S.library);render();break;
 case 'xbloomCheck':{
    const adminCode=S.xbloomAdminCode||window.prompt(L('رمز مسؤول مِعيار لفحص الحساب دون تصدير','Miyar administrator code for read-only account check'));
    if(!adminCode)break;
    S.xbloomAdminCode=adminCode;
    S.xbloomLastStatus=L('جاري فحص حساب xBloom دون إنشاء وصفة...','Checking xBloom without creating recipes...');
    render();
    fetch('https://miyar-coffee.vercel.app/api/xbloom/export',{
      method:'POST',headers:{'Content-Type':'application/json','X-Miyar-Test-Key':adminCode},
      body:JSON.stringify({action:'inspect_test'})
    }).then(async response=>{
      const out=await response.json().catch(()=>({error:'invalid_json_response'}));
      if(response.ok&&out.status==='listed'){
        const tests=Array.isArray(out.testRecipes)?out.testRecipes:[];
        const listed=Array.isArray(out.recentRecipes)?out.recentRecipes:tests;
        S.xbloomCheckLinks=listed.filter(x=>x&&typeof x.name==='string').map(x=>({name:x.name,shareUrl:(typeof x.shareUrl==='string'&&x.shareUrl.startsWith('https://share-h5.xbloom.com/?id='))?x.shareUrl:null}));
        S.xbloomLastStatus=L('نجح الاتصال بحساب xBloom. عدد وصفات الاختبار الموجودة: ','xBloom account connected. Test recipes: ')+tests.length+(tests.length?'\n'+tests.map(x=>x.name).join('\n'):'');
        toast(L('نجح فحص حساب xBloom دون تصدير','Account inspection succeeded'));
      }else{
        const text=out.error||'unknown_error';
        if(text==='invalid_test_key')S.xbloomAdminCode=null;
        S.xbloomLastStatus=L('تعذر فحص الحساب','Account inspection failed')+' · '+text+' · HTTP '+response.status;
        toast(L('فشل فحص الحساب؛ راجع الرسالة أسفل الأزرار','Check failed; see the message below'));
      }
      render();
    }).catch(()=>{
      S.xbloomLastStatus=L('تعذر الاتصال بخدمة الفحص','Could not connect to diagnostic service');render();
    });
    break;
  }
 case 'xbloomExport':{
  if(!S.recipe||E.validate(S.recipe).length){toast(L('صحح الوصفة قبل التصدير','Fix the recipe before export'));break;}
  if(S.recipe.dripper!=='omni'){
    S.xbloomLastStatus=L('تصدير الوصفات من مِعيار مدعوم حاليًا لقمع Omni فقط. اختر Omni من بداية الوصفة قبل التصدير.','Recipe export currently supports Omni only. Select Omni when creating the recipe.');
    render();toast(L('التصدير متاح لقمع Omni فقط','Only Omni recipes can be exported'));break;
  }

  const adminCode=S.xbloomAdminCode||window.prompt(L('رمز اختبار مسؤول مِعيار (ليس كلمة مرور xBloom)','Miyar administrator test code (not your xBloom password)'));
  if(!adminCode)break;
  S.xbloomAdminCode=adminCode;
  // The Studio and Miyar use the same validated 1-80 grind setting.
  if(!window.confirm(L('هل تريد إنشاء هذه الوصفة مرة واحدة في حساب xBloom المخصص لمِعيار؟','Create this recipe once in the dedicated Miyar xBloom account?')))break;
  const snapshot=JSON.stringify(S.recipe);
  node.disabled=true;node.textContent=L('جاري التصدير...','Exporting...');
  fetch('https://miyar-coffee.vercel.app/api/xbloom/export',{
    method:'POST',
    headers:{'Content-Type':'application/json','X-Miyar-Test-Key':adminCode},
    body:JSON.stringify({recipe:S.recipe})
  }).then(async response=>{
    const out=await response.json().catch(()=>({error:'response_not_json'}));
    if(response.ok&&out.status==='ready'&&typeof out.shareUrl==='string'){
      const u=new URL(out.shareUrl);
      if(u.protocol!=='https:'||u.hostname!=='share-h5.xbloom.com')throw Error('invalid_share_url');
      S.xbloomShareUrl=u.href;
      S.xbloomExportedSnapshot=snapshot;
      S.xbloomVerified=true;
      S.xbloomLastStatus=out.existing?L('الوصفة كانت محفوظة في xBloom؛ أعدت استخدامها دون إنشاء نسخة مكررة.','Existing xBloom recipe reused; no duplicate created.'):L('تم حفظ الوصفة والتحقق من رابط مشاركتها الرسمي.','Recipe saved and official share link verified.');
      render();
      toast(L('رابط xBloom جاهز؛ اضغط افتح الوصفة','xBloom link ready — tap Open recipe'));
    }else if(response.status===202){
      if(typeof out.shareUrl==='string'){
        const u=new URL(out.shareUrl);
        if(u.protocol==='https:'&&u.hostname==='share-h5.xbloom.com'){
          S.xbloomShareUrl=u.href;
          S.xbloomExportedSnapshot=snapshot;
          S.xbloomVerified=false;
          render();
        }
      }
      S.xbloomLastStatus=out.shareUrl?L('حُفظت الوصفة ووصل رابطها، لكن تأكيد فتحه غير مكتمل. لا تكرر التصدير.','Recipe saved and link returned but verification is incomplete. Do not retry.'):L('قد تكون الوصفة محفوظة، لكن لم يصل رابط رسمي بعد. اضغط فحص حساب xBloom قبل إعادة التصدير.','Recipe may be saved, but provider link is pending. Inspect account before trying again.');render();
      toast(L('تحقق من الرابط في xBloom؛ لا تكرر التصدير','Check xBloom link; do not retry'));
    }else{
      const messages={
        test_mode_not_enabled:L('وضع الاختبار غير مفعل','Test mode is disabled'),
        invalid_test_key:L('رمز الاختبار الإداري غير صحيح','Incorrect admin test code'),
        xbloom_preflight_list_failed:L('تعذر التأكد من الوصفات السابقة؛ لم يتم إرسال وصفة جديدة','Could not check for an existing recipe; no new write was attempted'),
        xbloom_credentials_missing:L('بيانات xBloom لم تصل إلى الخادم','Missing xBloom credentials'),
        xbloom_login_failed:L('رفض xBloom تسجيل الدخول لهذا الحساب','xBloom rejected account login'),
        invalid_grind_size:L('درجة الطحن ليست بين 1 و80','Grind is not between 1 and 80'),
        invalid_brew_ratio:L('نسبة البن إلى الماء غير صالحة. راجع الجرعة والماء قبل التصدير','Invalid coffee-to-water ratio. Review dose and water'),
        recipe_not_supported:L('هذه الوصفة ليست لقمع Omni. اختر Omni بدل xPod ثم جهّز الوصفة','Recipe is not for the Omni dripper. Select Omni and regenerate.'),
        xbloom_create_failed:L('رفض خادم xBloom حفظ الوصفة','xBloom rejected the recipe save'),
        xbloom_transport_or_api_error:L('تعذر إكمال الاتصال بخادم xBloom؛ لا تكرر الطلب قبل فحص الحساب','xBloom connection failed; inspect the account before retrying'),
        invalid_pours:L('عدد الصبات غير صالح','Invalid pour count'),
        pour_total_mismatch:L('مجموع الصبات لا يساوي كمية الماء','Pour sum does not match water'),
        origin_not_allowed:L('عنوان الموقع غير مسموح','Site origin not allowed')
      };
      if(out.error==='invalid_test_key')S.xbloomAdminCode=null;
      const message=messages[out.error]||L('رفض التصدير','Export rejected');
      const detail=out.providerMessage?String(out.providerMessage).slice(0,140):out.cause?String(out.cause):'';
      const provider=out.providerResult?' · xBloom: '+String(out.providerResult).slice(0,32):'';
      S.xbloomLastStatus=message+'\n'+(out.error||'unknown_error')+' · HTTP '+response.status+provider+(detail?'\n'+detail:'');
      render();
      toast(message+(detail?' — '+detail.slice(0,90):provider));
      const alert=document.querySelector('[role="alert"]');
      if(alert)alert.scrollIntoView({behavior:'smooth',block:'center'});
    }
  }).catch(()=>toast(L('تعذر الاتصال بالخادم؛ تحقق من الشبكة قبل إعادة المحاولة','Could not reach export service'))).finally(()=>{node.disabled=false;node.textContent=L('تصدير إلى xBloom (تجريبي)','Export to xBloom (beta)');});
  break;
 }
 case 'copy':copyText(brewText(S.recipe)).then(()=>toast(L('نُسخت الخطوات','Steps copied'))).catch(()=>toast(L('تعذر النسخ','Copy failed')));break;
 case 'download':{const file=new Blob([JSON.stringify(S.recipe,null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(file);const el=document.createElement('a');el.href=url;el.download=`miyar-${S.recipe.id}.json`;document.body.appendChild(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(url),500);toast(L('تم تنزيل ملف مِعيار','Miyar file downloaded'));break;}
 case 'share':{const str=JSON.stringify(S.recipe);const utf8=new TextEncoder().encode(str);let binary='';utf8.forEach(x=>binary+=String.fromCharCode(x));const u=location.href.split('#')[0]+'#r='+encodeURIComponent(btoa(binary));copyText(u).then(()=>toast(L('نُسخ الرابط؛ يحتاج نشر الموقع ليعمل خارج جهازك','Link copied; deploy site before sharing externally'))).catch(()=>toast(L('تعذر النسخ','Copy failed')));break;}
 case 'brew':if(E.validate(S.recipe).length){toast(L('صحح الصبات أولًا','Fix invalid pours first'));return;}S.brew={elapsed:0,running:false,lastTick:null};setPage('brewing');break;
 case 'timerToggle':if(!S.brew)return;S.brew.running=!S.brew.running;S.brew.lastTick=Date.now();render();break;
 case 'timerReset':S.brew={elapsed:0,running:false,lastTick:null};render();break;
 case 'timerEnd':if(S.brew)S.brew.running=false;setPage('tasting');break;
 case 'taste':S.ratingSaved=false;setPage('tasting');break;case 'rate':S.stars=Number(value);render();break;case 'issue':S.issue=value===S.issue?null:value;render();break;
 case 'saveTaste':if(!S.stars){toast(L('اختر تقييمًا من نجمة إلى خمس نجوم','Choose a 1–5 star rating'));return;}S.tastings.push({id:Date.now(),recipeId:S.recipe.id,bean:S.recipe.name,stars:S.stars,issue:S.issue,notes:S.tasteNotes.slice(0,500),at:new Date().toISOString()});S.tastings=S.tastings.slice(-200);store.set('miyar.tastings',S.tastings);S.ratingSaved=true;render();toast(L('حُفظ تقييم الكوب','Cup logged'));if(S.backendConnected)fetch('/api/tastings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({recipeId:S.recipe.id,stars:S.stars,issue:S.issue,notes:S.tasteNotes.slice(0,500)})}).catch(()=>{});break;
 case 'applyTaste':{if(!S.issue)return;const result=E.adjust(S.recipe,S.issue);if(E.validate(result.recipe).length){toast(L('التغيير خارج حدود الجهاز','Change exceeds machine limits'));return;}S.recipe=result.recipe;S.alternative=E.makeRecipe(S.recipe,S.recipe.variant==='balanced'?'aroma':'balanced');S.openPour=-1;setPage('result');toast(L('تم إعداد تجربة جديدة بتعديل واحد','New single-change experiment created'));break;}
 }
}
document.addEventListener('click',ev=>{const btn=ev.target.closest('[data-action]');if(!btn)return;if(btn.tagName==='A')ev.preventDefault();onAction(btn);});
document.addEventListener('input',ev=>{const t=ev.target;if(t.dataset.passport){const k=t.dataset.passport;S.passport[k]=Number(t.value);const label=$(`#label-${k}`);if(label)label.textContent=`${t.value}/5`;}if(t.dataset.input==='tasteNotes')S.tasteNotes=t.value;});
document.addEventListener('change',ev=>{const t=ev.target;if(t.dataset.input==='photo'){const file=t.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){toast(L('الملف ليس صورة','Not an image'));return;}if(file.size>3*1024*1024){toast(L('اختر صورة أقل من 3 ميغابايت','Please select an image under 3MB'));return;}const reader=new FileReader();reader.onload=()=>{S.photo=reader.result;render();};reader.readAsDataURL(file);return;}
 if(t.dataset.input){inputValue(t.dataset.input,t.value);return;}
 if(t.dataset.pourIndex!==undefined && t.dataset.pourField){const i=Number(t.dataset.pourIndex),field=t.dataset.pourField;S.recipe=E.updatePour(S.recipe,i,field,t.type==='checkbox'?t.checked:t.value);render();}
});
setInterval(()=>{if(S.page!=='brewing'||!S.brew?.running)return;const now=Date.now();const delta=(now-S.brew.lastTick)/1000;S.brew.lastTick=now;S.brew.elapsed=Math.min(E.duration(S.recipe),S.brew.elapsed+delta);if(S.brew.elapsed>=E.duration(S.recipe)){S.brew.running=false;render();toast(L('اكتمل المؤقّت','Timer complete'));return;}const time=$('#timer-text'),progress=$('#timer-progress');if(time)time.textContent=fmtTime(S.brew.elapsed);if(progress)progress.style.width=`${S.brew.elapsed/E.duration(S.recipe)*100}%`;const agenda=E.agenda(S.recipe);const current=agenda.find(x=>S.brew.elapsed<x.finish);if(current?.index!==S.brew.prevIndex){S.brew.prevIndex=current?.index;render();}},350);
initShared();render();if(location.protocol==='http:'||location.protocol==='https:'){fetch('/api/health').then(r=>{if(!r.ok)return null;return r.json();}).then(async data=>{if(data?.service!=='miyar')return;S.backendConnected=true;const response=await fetch('/api/recipes');if(!response.ok)return;const remote=(await response.json()).recipes||[];const ids=new Set(S.library.map(x=>x.id));remote.forEach(r=>{if(!ids.has(r.id)&&E.validate(r).length===0)S.library.push(r);});store.set('miyar.library',S.library);if(S.page==='library')render();}).catch(()=>{});}
})();

</script>
